@if (studyStreak && studyStreak.days > 0) {
  <app-srs-streak
    style="margin-bottom: 2rem"
    [consecutiveDays]="studyStreak.days"
    [hasBeenShown]="streakAnimationShown"
  ></app-srs-streak>
} @else {
  <span class="big-icon"
    ><mat-icon
      aria-hidden="false"
      aria-label="Done"
      class="icon text-primary"
      inline="true"
      >check_circle</mat-icon
    ></span
  >
}
<div class="text-center">
  <button mat-button color="accent" (click)="oneMoreRound.emit()">
    {{ 'srs.success.one_more' | transloco }}
  </button>
</div>
